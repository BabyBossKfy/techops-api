services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: techops
      POSTGRES_USER: techops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techops-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techops -d techops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://techops:${POSTGRES_PASSWORD:-techops-dev}@db:5432/techops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
